name: Update flake inputs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-flake:
    runs-on: ubuntu-latest

    steps:
      - name: Update flake inputs
        uses: caelestia-dots/.github/actions/nix-update@main
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          package: with-shell

      - name: Test modules
        run: |
          result/bin/sylph -v
          result/bin/sylph -h
          result/bin/sylph toggle -h
          result/bin/sylph scheme -h
          result/bin/sylph scheme list
          result/bin/sylph scheme get
          result/bin/sylph scheme set -n gruvbox -f hard -m dark -v content
          result/bin/sylph screenshot -h
          result/bin/sylph record -h
          result/bin/sylph clipboard -h
          result/bin/sylph emoji -h
          result/bin/sylph emoji
          result/bin/sylph wallpaper -h
          result/bin/sylph resizer -h

      - name: Test graphical stuff
        env:
          XDG_RUNTIME_DIR: /home/runner/runtime
          WLR_BACKENDS: headless
          WLR_LIBINPUT_NO_DEVICES: 1
          WAYLAND_DISPLAY: wayland-1
          GTK_USE_PORTAL: 0
        run: |
          mkdir $XDG_RUNTIME_DIR
          chown $USER $XDG_RUNTIME_DIR
          chmod 0700 $XDG_RUNTIME_DIR

          nix profile install 'nixpkgs#sway'
          sway &
          sleep 3  # Give Sway some time to start
          result/bin/sylph shell -d
          sleep 3  # Give the shell some time to start (and die)

          # Test CLI graphical modules
          result/bin/sylph clipboard &
          result/bin/sylph emoji -p &
          result/bin/sylph shell -s
          result/bin/sylph shell drawers list
          result/bin/sylph shell mpris list
          result/bin/sylph shell notifs clear

          pgrep .quickshell-wra  # Fail job if shell died
          result/bin/sylph shell -k
          killall sway  # Screw using IPC
